ids = ["type:Scene", "type:SceneBlock", "type:SceneError", "type:SceneSection", "type:SceneShading", "type:SceneQuad"]
why = "Scenes drawn by DrawContext::draw_scene can be split into sections that move, turn, fade by light and hide as units in one shared depth (Scene::sections; SceneBlock::section), carry quads drawn in the scene's depth (Scene::quads, at most 16,384), choose view-fixed two-light shading (Scene::shading) and a biome for their tints (Scene::biome), show a block's breaking overlay (SceneBlock::breaking), draw fluids from the blocks' states, and draw the game's own block entities (chests, signs, banners…) by their renderers from optional saved data (SceneBlock::game_data). New refusals: BadSection, TooManyQuads, BadQuad and BadBiome. A scene with no sections draws as before."
migrate = "Nothing to change: Scene::new and SceneBlock::new give the old behaviour (no sections, face shading, the fixed grass colour, no quads). A wasm mod built against the earlier layout is rebuilt against this SDK."
