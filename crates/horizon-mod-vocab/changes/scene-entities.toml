ids = ["type:GuiEntity", "type:GuiEntityError", "type:SceneEntityPart", "type:SceneParts", "type:ScenePartsError"]
why = "Screens and scenes draw more than living entities. GuiEntity::Kind also takes a dropped item (minecraft:item) and every minecart kind, and the new GuiEntity::General draws a mod's general type from a GeneralRenderState by the renderer its type registered, each by the route the world draws it with. SceneParts::entities (SceneEntityPart) puts a scene entity in a group, so it moves, hides and is lit with it, and gives it an age of its own; ScenePartsError::BadEntityPart refuses a part naming no entity, no group or an entity twice."
migrate = "Additive. A Kind the game drew before draws the same; a type it refused before as unknown may now draw. GuiEntity gains a variant at the end of its wire form; SceneParts gains a field."
